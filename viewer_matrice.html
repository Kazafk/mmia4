# La Matrice de Priorisation IA : Choisir les Bons Cas d'Usage

L'un des plus grands défis pour le manager est de savoir **par quoi commencer**. La tentation est forte de vouloir tout automatiser d'un coup, ou à l'inverse, de viser un cas d'usage si complexe qu'il n'aboutira jamais. 

Cette matrice, inspirée des cadres de *Gartner* et de *McKinsey*, permet au manager de classer méthodiquement les idées d'automatisation de son équipe et de lancer les bons projets au bon moment.

---

## 1. Les 3 Niveaux d'Ambition IA

Avant de lancer un projet, qualifiez sa nature :

1. **Everyday AI (IA du Quotidien) :** 
   - *But :* Améliorer la productivité sur des tâches routinières. Faible risque.
   - *Exemples en assurance :* Résumer une longue chaîne de mails avec un courtier, rédiger le premier jet d'un compte-rendu de réunion, trier les e-mails entrants par urgence.
2. **Boundary-pushing AI (IA Repoussant les Limites) :** 
   - *But :* Optimiser les opérations à grande échelle.
   - *Exemples en assurance :* Un assistant IA interne qui analyse l'ensemble des conditions générales pour répondre instantanément aux questions des clients sur leurs garanties. Détection automatisée de doublons ou d'incohérences dans les déclarations de sinistres.
3. **Game-changing AI (IA Transformatrice) :** 
   - *But :* Disrupter le modèle d'affaires. Haut risque, haut rendement.
   - *Exemples en assurance :* Tarification dynamique et personnalisée des risques en temps réel basée sur des données non structurées. Souscription automatisée de contrats simples sans intervention humaine.

> **💡 Conseil au Manager :** Commencez toujours par 2 ou 3 projets "Everyday AI" pour créer des "Quick Wins" (victoires rapides) et bâtir la confiance de l'équipe avant de viser plus haut.

---

## 2. Raisonner en "Workflows de bout en bout"

**Erreur fréquente :** Automatiser une tâche isolée (ex: "générer un mail de réponse") sans repenser le workflow complet. McKinsey recommande de cartographier le processus de bout en bout, puis d'identifier les points où l'IA crée le plus de valeur.

**Exemple : Le Workflow de Gestion d'un Sinistre MRH**

| Étape du workflow | Tâche actuelle (manuelle) | Potentiel IA | Niveau |
|---|---|---|---|
| 1. Réception de la déclaration | Tri manuel des mails, saisie des informations dans le SI | Extraction automatique des données du mail et pré-remplissage du formulaire | Everyday |
| 2. Analyse du rapport d'expertise | Lecture d'un PDF de 15 pages, rédaction d'une fiche synthétique | Résumé automatique du rapport en 5 bullet points clés | Everyday |
| 3. Vérification des garanties | Consultation manuelle des CGV et du contrat de l'assuré | Assistant IA interrogeant la base documentaire des contrats | Boundary-pushing |
| 4. Chiffrage de l'indemnisation | Calcul manuel basé sur les barèmes et l'expertise | Suggestion de fourchette d'indemnisation basée sur les dossiers similaires | Game-changing |
| 5. Communication avec l'assuré | Rédaction manuelle de chaque courrier/mail de suivi | Génération de brouillons de courriers personnalisés et empathiques | Everyday |
| 6. Clôture et archivage | Saisie manuelle du bilan dans le SI | Compte-rendu automatique et classement intelligent | Everyday |

```mermaid
journey
    title Parcours du Sinistre : Opportunités IA
    section 1. Déclaration
      Tri Mail et Saisie: 2: IA (Everyday)
    section 2. Analyse
      Résumé Expertise: 4: IA (Everyday)
      Vérif Garanties: 5: IA (Boundary)
    section 3. Décision
      Chiffrage: 7: IA (Game-changing)
    section 4. Finalisation
      Courrier Assuré: 3: IA (Everyday)
      Archivage: 1: IA (Everyday)
```

> **💡 Ce tableau montre que sur 6 étapes, 4 sont des "Everyday AI" à faible risque.** C'est par elles qu'il faut commencer pour libérer du temps sur les étapes 3 et 4, qui nécessitent une expertise métier forte et un cadrage éthique (cf. *Checklist des Feux Verts*).

---

## 3. L'Outil de Scoring des Cas d'Usage

Pour chaque idée proposée par votre équipe (les fameux "Micro-bets" ou micro-paris), évaluez-la sur 3 critères (de 1 à 5) :

### Critère A : Faisabilité Technique & Data
| Score | Description |
|---|---|
| 1 | Données inexistantes, silotées, ou IA non adaptée au besoin. |
| 2 | Données partiellement disponibles, nécessitent un travail de nettoyage important. |
| 3 | Données disponibles mais non connectées à l'outil d'IA. Intégration nécessaire avec l'IT. |
| 4 | Données propres et accessibles. Un outil d'IA existant peut être utilisé avec un paramétrage léger. |
| 5 | Données propres, structurées. L'outil d'IA générative interne est déjà disponible et formé sur ce type de tâche. |

### Critère B : Tolérance au Risque & Conformité
| Score | Description |
|---|---|
| 1 | Risque critique : décision impactant directement l'assuré (refus de garantie, tarification), données de santé, risque d'hallucination grave. |
| 2 | Risque élevé : données personnelles identifiables (DPI) impliquées, sortie IA directement visible par le client sans relecture. |
| 3 | Risque modéré : données internes sensibles (chiffre d'affaires, stratégie), nécessite une validation humaine systématique. |
| 4 | Risque faible : données anonymisées ou agrégées, usage purement interne avec relecture. |
| 5 | Risque nul : synthèse de documents publics, automatisation d'une tâche administrative sans impact client ni donnée sensible. |

### Critère C : Impact Métier & Humain
| Score | Description |
|---|---|
| 1 | Faible gain de temps, tâche très rare (ex: moins d'une fois par mois). |
| 2 | Gain marginal, la tâche est déjà relativement fluide manuellement. |
| 3 | Gain modéré : environ 30 min économisées par jour, ou réduction d'un irritant mineur. |
| 4 | Gain significatif : 1h+ économisée par jour, ou suppression d'un irritant reconnu par toute l'équipe. |
| 5 | Gain massif : 2h+ sauvées par jour et par collaborateur, ET réduction d'une tâche perçue comme un "irritant majeur" par l'équipe, ET libération de temps pour des activités à haute valeur ajoutée (relation client, conseil). |

## 5. Matrice de Décision

Additionnez vos scores A + B + C (sur 15) :

### 🟢 Score entre 12 et 15 — Les "Feux Verts"
**Go immédiat.** Ce sont vos projets de type *Everyday AI*. Lancez-les en "Micro-bets" de 10 jours. C'est ici que votre équipe va s'acculturer et prendre confiance. Pas besoin de validation IT lourde.

### 🟡 Score entre 8 et 11 — Les "Stratégiques"
**À planifier.** Le gain est fort mais le risque ou la complexité nécessitent l'appui de l'IT, du service conformité, et/ou du DPO (Délégué à la Protection des Données). Prévoyez un POC (Proof of Concept) encadré de 1 à 3 mois.

### 🔴 Score inférieur à 8 — Les "Faux Amis"
**À écarter pour l'instant.** L'effort d'intégration est trop lourd par rapport au bénéfice, ou le risque éthique/réglementaire est trop élevé. Ne gaspillez pas le capital confiance de votre équipe sur ces sujets. Ils pourront être réévalués dans 6 à 12 mois quand la maturité IA de l'entreprise aura progressé.

## 6. Comment Animer un Atelier de Priorisation avec son Équipe

**Durée :** 1h30 | **Participants :** Le manager + toute l'équipe opérationnelle (5 à 10 personnes)

### Phase 1 — Collecte (20 min)
Chaque collaborateur note sur un post-it (physique ou digital) **les 2 tâches les plus chronophages ou pénibles de sa semaine**. Pas de filtre, pas de jugement. On collecte les "irritants".

### Phase 2 — Regroupement (10 min)
Le manager regroupe les post-its par thème (ex: "Rédaction", "Recherche documentaire", "Saisie de données", "Communication client"). Les doublons montrent les irritants partagés par toute l'équipe.

### Phase 3 — Scoring collectif (40 min)
Pour chaque irritant regroupé, l'équipe attribue ensemble les scores A, B, C en débattant ouvertement. C'est un moment clé de co-construction (*Open-Source Change*). Le manager facilite le débat mais ne décide pas seul.

### Phase 4 — Engagement (20 min)
On sélectionne les 2 ou 3 cas d'usage "Feux Verts" (🟢). Pour chacun, on désigne un **"Champion IA"** volontaire dans l'équipe (celui qui testera l'outil pendant 10 jours et partagera ses retours). On fixe une date de bilan.

> **💡 L'objectif caché de cet atelier :** Ce n'est pas de trouver le meilleur cas d'usage. C'est de donner la parole aux collaborateurs, de les impliquer dans la décision, et de transformer la peur de l'IA en curiosité. Le changement devient le leur, pas celui de la direction.

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const rawMarkdown = document.getElementById("md-data").textContent;
            // Remove leading indentation to prevent marked.js from turning HTML blocks into <pre><code>
            const cleanMarkdown = rawMarkdown.replace(/^[ \t]+/gm, '');
            
            // Initialize Mermaid
            mermaid.initialize({ startOnLoad: false, theme: 'dark', backgroundColor: 'transparent' });
            
            // Render Markdown
            document.getElementById("content").innerHTML = marked.parse(cleanMarkdown);
            
            // Render Mermaid blocks
            document.querySelectorAll('code.language-mermaid').forEach((block, index) => {
                const parent = block.parentElement;
                const newDiv = document.createElement('div');
                newDiv.className = 'mermaid fade-in-section';
                newDiv.id = 'mermaid-diagram-' + index;
                newDiv.style.textAlign = 'center';
                newDiv.style.margin = '2rem 0';
                newDiv.textContent = block.textContent;
                parent.replaceWith(newDiv);
            });
            
            try {
                await mermaid.run({
                    nodes: document.querySelectorAll('.mermaid')
                });
            } catch (err) {
                console.error("Mermaid error:", err);
            }
            
            // 1. Generate Table of Contents (TOC)
            const content = document.getElementById("content");
            const headings = content.querySelectorAll("h2, h3");
            const toc = document.getElementById("toc");
            
            headings.forEach((heading, index) => {
                // Create unique ID if not present
                if (!heading.id) {
                    heading.id = "heading-" + index;
                }
                
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "#" + heading.id;
                a.textContent = heading.textContent;
                
                if (heading.tagName.toLowerCase() === "h3") {
                    a.classList.add("toc-h3");
                }
                
                li.appendChild(a);
                toc.appendChild(li);
            });

            // 2. Add Intersection Observer for TOC highlight & Scroll Animation
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            // Wrap elements in animated containers
            const elementsToAnimate = content.querySelectorAll("h2, h3, p, ul, ol, blockquote, table, .mermaid");
            
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    // Animation
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                    }
                    
                    // TOC Highlighting (only for headings)
                    if (entry.isIntersecting && (entry.target.tagName === 'H2' || entry.target.tagName === 'H3')) {
                        document.querySelectorAll('#toc a').forEach(a => {
                            a.classList.remove('active');
                            if (a.getAttribute('href') === '#' + entry.target.id) {
                                a.classList.add('active');
                            }
                        });
                    }
                });
            }, observerOptions);

            elementsToAnimate.forEach(el => {
                el.classList.add('fade-in-section');
                observer.observe(el);
            });

            // 3. Progress Bar
            window.addEventListener('scroll', () => {
                const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
                const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
                const scrolled = (winScroll / height) * 100;
                document.getElementById("progress-bar").style.width = scrolled + "%";
            });

            // 4. Three.js Corporate 3D Sphere Background
            gsap.registerPlugin(ScrollTrigger);
            const canvas = document.getElementById('bg-canvas');
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, (window.innerWidth * 0.6) / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
            
            renderer.setSize(window.innerWidth * 0.6, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const geometry = new THREE.IcosahedronGeometry(2.5, 1);
            const material = new THREE.MeshBasicMaterial({ color: 0x38bdf8, wireframe: true, transparent: true, opacity: 0.6 });
            const sphere = new THREE.Mesh(geometry, material);
            
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 200;
            const posArray = new Float32Array(particlesCount * 3);
            for(let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 5; }
            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const particlesMaterial = new THREE.PointsMaterial({ size: 0.05, color: 0xa855f7 });
            const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);

            scene.add(sphere);
            scene.add(particlesMesh);
            camera.position.z = 5;

            let mouseX = 0; let mouseY = 0; let targetX = 0; let targetY = 0;
            const windowHalfX = (window.innerWidth * 0.6) / 2;
            const windowHalfY = window.innerHeight / 2;
            document.addEventListener('mousemove', (event) => { mouseX = (event.clientX - windowHalfX) * 0.001; mouseY = (event.clientY - windowHalfY) * 0.001; });

            gsap.to(sphere.rotation, { scrollTrigger: { trigger: "body", start: "top top", end: "bottom bottom", scrub: 1 }, x: Math.PI * 2, y: Math.PI });
            gsap.to(camera.position, { scrollTrigger: { trigger: "body", start: "top top", end: "bottom bottom", scrub: 1 }, z: 3 });

            const clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                const elapsedTime = clock.getElapsedTime();
                targetX = mouseX * 0.5; targetY = mouseY * 0.5;
                sphere.rotation.y += 0.005; particlesMesh.rotation.y = -elapsedTime * 0.1;
                sphere.rotation.x += 0.05 * (targetY - sphere.rotation.x); sphere.rotation.y += 0.05 * (targetX - sphere.rotation.y);
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = (window.innerWidth * 0.6) / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth * 0.6, window.innerHeight);
            });
        });
    </script>
